[package]
name = "timbrado"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Measure what upstream changes make possible for your codebase"
license = "MIT"
publish = false

[lib]
path = "native/lib.rs"

[[bin]]
name = "timbrado"
path = "native/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"

[profile.release]
strip = true
